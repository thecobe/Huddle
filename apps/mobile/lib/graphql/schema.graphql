  TEAM_MANAGER
}

type MembershipSummary {
  clubId: ID!
  clubName: String!
  id: ID!
  role: MembershipRole!
  teamId: ID
}

type Mutation {
  acceptInvitation(input: AcceptInvitationInput!): AuthPayload!

  """Restituisce la scheda del minore aggiornata."""
  addGuardian(guardianId: ID!, minorId: ID!, relation: GuardianRelation! = GUARDIAN): Person!
  addPlayer(input: PlayerInput, personId: ID!, teamId: ID!): TeamDetail!

  """Se la persona ha un account, riceve l'accesso alla squadra."""
  addStaff(personId: ID!, role: StaffRole!, teamId: ID!): TeamDetail!

  """Annulla gli eventi in un periodo; restituisce quanti."""
  cancelEventsInRange(input: CancelRangeInput!): Int!
  changePassword(currentPassword: String! = "", newPassword: String!): Boolean!

  """Importa tutte le righe; rifiuta il file se una riga ha errori."""
  commitPeopleImport(rows: [PersonImportRow!]!): PeopleImportSummary!
  completeRollCall(eventId: ID!): RollCall!
  consumeMagicLink(token: String!): AuthPayload!

  """
  Passaggio di stagione: copia squadre e staff, a richiesta anche gli atleti.
  """
  copyTeams(input: CopyTeamsInput!): [Team!]!

  """Nuovo link iCal (personale o di squadra); revoca il precedente."""
  createCalendarFeed(teamId: ID): CalendarFeed!

  """Crea una società; l'utente ne diventa amministratore."""
  createClub(input: ClubInput!): Club!
  createEvent(input: EventInput!): CalendarEvent!
  createEventSeries(input: SeriesInput!): EventSeries!
  createPerson(input: PersonInput!): Person!
  createSeason(input: SeasonInput!): Season!
  createTeam(input: TeamInput!): TeamDetail!

  """Solo eventi singoli; le occorrenze di una serie si annullano."""
  deleteEvent(id: ID!): Boolean!
  disableTwoFactor(code: String!): Boolean!

  """Attiva il 2FA e restituisce i codici di recupero."""
  enableTwoFactor(code: String!): [String!]!
  endEventSeries(fromDate: String!, id: ID!): Boolean!
  inviteMember(input: InviteMemberInput!): Invitation!

  """
  Invita la persona ad attivare un account collegato alla scheda. La segreteria può usare ogni ruolo consentito; un tutore può solo attivare l'account ATHLETE di un figlio dai 14 anni.
  """
  invitePersonAccount(email: String!, personId: ID!, role: MembershipRole!): Invitation!
  login(input: LoginInput!): AuthPayload!
  logout(refreshToken: String): Boolean!

  """Valida le righe senza scrivere nulla."""
  previewPeopleImport(rows: [PersonImportRow!]!): [PersonImportResult!]!

  """
  Registra presenze (anche da coda offline). Idempotente per clientMutationId; esito riga per riga.
  """
  recordAttendance(entries: [AttendanceEntryInput!]!): [AttendanceEntryResult!]!

  """
  Registra un consenso. IMAGE_RELEASE e MARKETING richiedono la società corrente.
  """
  recordConsent(granted: Boolean!, kind: ConsentKind!): Consent!

  """
  Rinnova la sessione. Il client web omette refreshToken e usa il cookie.
  """
  refreshSession(refreshToken: String): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  registerDevice(input: RegisterDeviceInput!): Boolean!

  """Restituisce la scheda del minore aggiornata."""
  removeGuardian(guardianshipId: ID!): Person!
  removeMembership(membershipId: ID!): Boolean!
  removePlayer(rosterId: ID!): TeamDetail!
  removeStaff(staffId: ID!): TeamDetail!
  reportAbsence(eventId: ID!, personId: ID!, reason: String): [Participation!]!

  """Invia un link di accesso via e-mail. Restituisce sempre true."""
  requestMagicLink(email: String!): Boolean!

  """Restituisce sempre true."""
  requestPasswordReset(email: String!): Boolean!
  resetPassword(newPassword: String!, token: String!): Boolean!
  revokeCalendarFeed(teamId: ID): Boolean!
  revokeInvitation(id: ID!): Boolean!
  setEventCancelled(cancelled: Boolean!, id: ID!, reason: String): CalendarEvent!
  setPersonArchived(archived: Boolean!, id: ID!): Person!
  setSeasonStatus(id: ID!, status: SeasonStatus!): Season!
  setTeamArchived(archived: Boolean!, id: ID!): TeamDetail!
  setupTwoFactor: TwoFactorSetup!
  unregisterDevice(token: String!): Boolean!
  updateClub(input: ClubInput!): Club!

  """Modifica una singola occorrenza, che smette di seguire la serie."""
  updateEvent(id: ID!, input: EventInput!): CalendarEvent!

  """
  Modifica la serie da `fromDate` (mai prima di oggi); le date modificate a mano restano.
  """
  updateEventSeries(fromDate: String, id: ID!, input: SeriesInput!): EventSeries!
  updateMe(input: UpdateMeInput!): Me!
  updatePerson(id: ID!, input: PersonInput!): Person!

  """Recapiti: modificabili anche dalla persona stessa e dai suoi tutori."""
  updatePersonContacts(id: ID!, input: PersonContactsInput!): Person!
  updatePlayer(input: PlayerInput!, rosterId: ID!): TeamDetail!
  updateTeam(id: ID!, input: TeamInput!): TeamDetail!
  verifyTwoFactor(challengeToken: String!, code: String!): AuthPayload!
  withdrawAbsence(noticeId: ID!): [Participation!]!
}

