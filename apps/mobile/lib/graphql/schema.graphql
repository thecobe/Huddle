input AcceptInvitationInput {
  acceptTerms: Boolean!

  """Obbligatorio se non esiste ancora un account"""
  fullName: String

  """Facoltativa: le famiglie possono accedere solo con magic link"""
  password: String
  token: String!
}

type AuditEvent {
  action: String!
  actorName: String
  actorUserId: String
  createdAt: DateTime!
  entityId: String
  entityType: String
  id: ID!
  metadata: JSON!
}

"""
Esito di un accesso. Con AUTHENTICATED contiene i token; con TWO_FACTOR_REQUIRED il challengeToken da usare in verifyTwoFactor. Per il client web (header X-Huddle-Client: web) il refresh token è in un cookie httpOnly e refreshToken è null.
"""
type AuthPayload {
  accessToken: String
  accessTokenExpiresAt: DateTime
  challengeToken: String
  refreshToken: String
  status: AuthStatus!
  user: Me
}

enum AuthStatus {
  AUTHENTICATED
  TWO_FACTOR_REQUIRED
}

type Club {
  addressLine: String
  city: String
  country: String!
  createdAt: DateTime!
  email: String

  """Federazioni ed enti di promozione sportiva di affiliazione"""
  federations: [String!]!
  id: ID!
  legalName: String
  name: String!
  phone: String
  postalCode: String
  province: String
  sport: String!

  """Codice fiscale"""
  taxCode: String

  """Partita IVA"""
  vatNumber: String
}

input ClubInput {
  addressLine: String
  city: String
  email: String
  federations: [String!]
  legalName: String
  name: String!
  phone: String
  postalCode: String
  province: String
  sport: String
  taxCode: String
  vatNumber: String
}

type Consent {
  """Null per i consensi validi su tutta la piattaforma"""
  clubId: ID
  granted: Boolean!
  kind: ConsentKind!
  recordedAt: DateTime!
  version: String!
}

enum ConsentKind {
  IMAGE_RELEASE
  MARKETING
  PRIVACY_POLICY
  TERMS_OF_SERVICE
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

enum DevicePlatform {
  ANDROID
  IOS
  WEB
}

type Invitation {
  acceptedAt: DateTime
  createdAt: DateTime!
  email: String!
  expiresAt: DateTime!
  id: ID!
  revokedAt: DateTime
  role: MembershipRole!
  teamId: ID
}

"""Anteprima pubblica di un invito, mostrata prima dell'accettazione."""
type InvitationPreview {
  """Esiste già un account con questa e-mail"""
  accountExists: Boolean!
  clubId: ID!
  clubName: String!
  email: String!
  expiresAt: DateTime!
  role: MembershipRole!
}

input InviteMemberInput {
  email: String!
  role: MembershipRole!
  teamId: ID
}

"""Valore JSON arbitrario"""
scalar JSON

input LoginInput {
  email: String!
  password: String!
}

type Me {
  email: String!
  fullName: String!
  id: ID!
  locale: String!
  memberships: [MembershipSummary!]!
  twoFactorEnabled: Boolean!
}

type Member {
  createdAt: DateTime!
  email: String!
  fullName: String!
  membershipId: ID!
  role: MembershipRole!
  teamId: ID
  userId: ID!
}

enum MembershipRole {
  ADMIN
  ATHLETE
  COACH
  PARENT
  SECRETARY
  SPORTS_DIRECTOR
  TEAM_MANAGER
}

type MembershipSummary {
  clubId: ID!
  clubName: String!
  id: ID!
  role: MembershipRole!
  teamId: ID
}

type Mutation {
  acceptInvitation(input: AcceptInvitationInput!): AuthPayload!
  changePassword(currentPassword: String! = "", newPassword: String!): Boolean!
  consumeMagicLink(token: String!): AuthPayload!

  """Crea una società; l'utente ne diventa amministratore."""
  createClub(input: ClubInput!): Club!
  createSeason(input: SeasonInput!): Season!
  disableTwoFactor(code: String!): Boolean!

  """Attiva il 2FA e restituisce i codici di recupero."""
  enableTwoFactor(code: String!): [String!]!
  inviteMember(input: InviteMemberInput!): Invitation!
  login(input: LoginInput!): AuthPayload!
  logout(refreshToken: String): Boolean!

  """
  Registra un consenso. IMAGE_RELEASE e MARKETING richiedono la società corrente.
  """
  recordConsent(granted: Boolean!, kind: ConsentKind!): Consent!

  """
  Rinnova la sessione. Il client web omette refreshToken e usa il cookie.
  """
  refreshSession(refreshToken: String): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  registerDevice(input: RegisterDeviceInput!): Boolean!
  removeMembership(membershipId: ID!): Boolean!

  """Invia un link di accesso via e-mail. Restituisce sempre true."""
  requestMagicLink(email: String!): Boolean!

  """Restituisce sempre true."""
  requestPasswordReset(email: String!): Boolean!
  resetPassword(newPassword: String!, token: String!): Boolean!
  revokeInvitation(id: ID!): Boolean!
  setSeasonStatus(id: ID!, status: SeasonStatus!): Season!
  setupTwoFactor: TwoFactorSetup!
  unregisterDevice(token: String!): Boolean!
  updateClub(input: ClubInput!): Club!
  updateMe(input: UpdateMeInput!): Me!
  verifyTwoFactor(challengeToken: String!, code: String!): AuthPayload!
}

type Query {
  auditEvents(beforeId: String, limit: Int! = 50): [AuditEvent!]!

  """Società corrente (header X-Tenant-Id)."""
  club: Club!
  invitationPreview(token: String!): InvitationPreview!

  """Inviti in attesa"""
  invitations: [Invitation!]!
  me: Me!
  members: [Member!]!
  myConsents: [Consent!]!

  """Esportazione dei dati personali (GDPR art. 15)"""
  myDataExport: JSON!
  seasons: [Season!]!
}

input RegisterDeviceInput {
  appVersion: String
  platform: DevicePlatform!

  """Token FCM/APNs del dispositivo"""
  token: String!
}

input RegisterInput {
  """Accettazione di informativa privacy e termini di servizio"""
  acceptTerms: Boolean!
  email: String!
  fullName: String!
  locale: String
  password: String!
}

type Season {
  createdAt: DateTime!

  """Data ISO (YYYY-MM-DD)"""
  endsOn: String!
  id: ID!
  name: String!

  """Data ISO (YYYY-MM-DD)"""
  startsOn: String!
  status: SeasonStatus!
}

input SeasonInput {
  endsOn: String!
  name: String!
  startsOn: String!
}

enum SeasonStatus {
  CLOSED
  OPEN
  PLANNED
}

type TwoFactorSetup {
  otpauthUri: String!
  secret: String!
}

input UpdateMeInput {
  fullName: String
  locale: String
}