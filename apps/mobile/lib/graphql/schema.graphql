type Query {
  attendanceRegister(from: DateTime!, kind: EventKind, teamId: ID!, to: DateTime!): AttendanceRegister!
  auditEvents(beforeId: String, limit: Int! = 50): [AuditEvent!]!

  """Società corrente (header X-Tenant-Id)."""
  club: Club!
  event(id: ID!): CalendarEvent!

  """Serie ricorrenti attive (non ancora terminate)."""
  eventSeries(teamId: ID): [EventSeries!]!

  """Eventi delle squadre visibili e di società; al massimo 120 giorni."""
  events(from: DateTime!, teamId: ID, to: DateTime!): [CalendarEvent!]!
  invitationPreview(token: String!): InvitationPreview!

  """Inviti in attesa"""
  invitations: [Invitation!]!

  """Squadre di cui può gestire il calendario; vuoto se nessuna."""
  manageableTeamIds: [ID!]!
  me: Me!
  members: [Member!]!

  """
  Agenda personale: proprie squadre, squadre dei figli, eventi di società.
  """
  myAgenda(from: DateTime!, to: DateTime!): [CalendarEvent!]!
  myConsents: [Consent!]!

  """Esportazione dei dati personali (GDPR art. 15)"""
  myDataExport: JSON!

  """Partecipazione all'evento dell'utente e dei suoi figli."""
  myParticipation(eventId: ID!): [Participation!]!

  """Scheda dell'utente e dei minori di cui è tutore."""
  myPeople: [Person!]!

  """
  Persone visibili: tutte per la segreteria, quelle delle proprie squadre per lo staff.
  """
  people(filter: PeopleFilter, limit: Int! = 50, offset: Int! = 0): PeoplePage!
  person(id: ID!): Person!

  """Presenze recenti della persona stessa o di un figlio."""
  personAttendance(limit: Int! = 20, personId: ID!): [PersonAttendance!]!

  """Appello di un evento: rosa, presenze registrate e assenze annunciate."""
  rollCall(eventId: ID!): RollCall!
  seasons: [Season!]!
  team(id: ID!): TeamDetail!

  """
  Squadre visibili: tutte per la direzione, le proprie per staff, atleti e famiglie.
  """
  teams(includeArchived: Boolean! = false, seasonId: ID): [Team!]!
}

